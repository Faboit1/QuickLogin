# =====================================================================
#  QuickLogin  -  configuration
# ---------------------------------------------------------------------
#  Auto-registers/auto-logs premium Java players and Bedrock (Floodgate)
#  players into AuthMeReloaded.
#
#  Premium players are those who arrive already Mojang-verified (a real
#  version-4 UUID). That verification is done by online-mode login (your
#  proxy in online-mode, or a standalone online-mode server) - not by this
#  plugin. Behind a proxy, this requires modern player-info forwarding so
#  the real UUID reaches the backend. See the README for details.
# =====================================================================

config-version: 2

premium:
  # Auto-login Java players who arrive with a real, Mojang-verified (v4) UUID.
  enabled: true

floodgate:
  # Auto-login Bedrock (Floodgate) players into AuthMe on join.
  enabled: true

auth:
  # Register brand-new premium/Bedrock players in AuthMe automatically,
  # using a random generated password stored in SQLite. On later joins the
  # same stored password is used. Players never run /register or /login.
  auto-register: true

  # AuthMe 6 shows a login dialog during the connection's configuration phase
  # (before the player is fully online). When true, QuickLogin approves trusted
  # players (Bedrock, and premium/verified v4-UUID players) through that dialog
  # so it never appears for them, while normal players still get it. Requires
  # AuthMe 6's pre-join dialog; harmless if absent.
  skip-prejoin-dialog: true

  # Length of the randomly generated password. Kept under AuthMe's max
  # password length (default 30) so registration is never rejected.
  generated-password-length: 16

  # Ticks to wait after join before logging the player into AuthMe. Increase
  # if another plugin processes the join late. (20 ticks = 1 second.)
  login-delay-ticks: 5

database:
  # SQLite file inside the plugin folder.
  file: "quicklogin.db"

# Verbose logging. Never logs passwords.
debug: false
