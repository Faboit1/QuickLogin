# =====================================================================
#  QuickLogin  -  configuration
# ---------------------------------------------------------------------
#  Auto-registers/auto-logs premium Java players and Bedrock (Floodgate)
#  players into AuthMeReloaded.
# =====================================================================

config-version: 2

premium:
  # Verify paid (Mojang/Microsoft) Java accounts and auto-register/auto-login
  # them with zero friction.
  #
  # Standalone (no proxy): QuickLogin performs the real Mojang encryption
  # handshake itself (via PacketEvents). Requires PacketEvents installed.
  # IMPORTANT: set 'settings.enablePremium: false' in AuthMe's config so the
  # two don't both run the handshake.
  #
  # Behind a proxy (BungeeCord/Velocity in offline-mode): QuickLogin detects
  # premium players by checking the Mojang API for the username. This works
  # with offline-mode proxies - cracked players can still join normally.
  #
  # Cracked players and expired/invalid sessions fall through to AuthMe's
  # normal login (they are NOT kicked).
  enabled: true

  # How QuickLogin detects whether it is behind a proxy:
  #   auto  - check spigot.yml (bungeecord) and Paper config (velocity)
  #   true  - force proxy mode (Mojang API name lookup, no handshake)
  #   false - force standalone mode (full Mojang handshake via PacketEvents)
  # If auto-detect gets it wrong, set this explicitly.
  proxy: auto

floodgate:
  # Auto-login Bedrock (Floodgate) players into AuthMe on join.
  enabled: true

auth:
  # Register brand-new premium/Bedrock players in AuthMe automatically,
  # using a random generated password stored in SQLite. On later joins the
  # same stored password is used. Players never run /register or /login.
  auto-register: true

  # AuthMe 6 shows a login dialog during the connection's configuration phase
  # (before the player is fully online). When true, QuickLogin approves trusted
  # players (Bedrock, and premium/verified v4-UUID players) through that dialog
  # so it never appears for them, while normal players still get it. Requires
  # AuthMe 6's pre-join dialog; harmless if absent.
  skip-prejoin-dialog: true

  # Length of the randomly generated password. Kept under AuthMe's max
  # password length (default 30) so registration is never rejected.
  generated-password-length: 16

  # Ticks to wait after join before logging the player into AuthMe. Increase
  # if another plugin processes the join late. (20 ticks = 1 second.)
  login-delay-ticks: 5

mojang:
  # Direct Mojang API tuning for premium-name detection.
  request-timeout-ms: 5000
  cache-seconds: 600

database:
  # SQLite file inside the plugin folder.
  file: "quicklogin.db"

# Verbose logging. Never logs passwords.
debug: false
