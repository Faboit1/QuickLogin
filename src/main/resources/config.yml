# =====================================================================
#  QuickLogin  -  configuration
# ---------------------------------------------------------------------
#  Floodgate (Bedrock) + premium Java auto-login for AuthMeReloaded.
#
#  This plugin is designed to be drag-and-drop. The defaults below are
#  safe for the common setup: an OFFLINE-mode Paper server sitting behind
#  a Geyser/Floodgate + Java proxy, using AuthMeReloaded for login.
# =====================================================================

# Config version. Do not edit by hand; used for automatic migration.
config-version: 1

premium:
  # Master switch for premium Java auto-login.
  # When true, QuickLogin performs the Mojang encryption handshake for
  # players whose name is a paid Minecraft account, verifies their session
  # and logs them into AuthMe automatically.
  enabled: true

  # If a name is NOT a premium account (cracked player), let it log in as
  # a normal offline player and go through AuthMe as usual.
  allow-cracked: true

  # When a premium account joins but its session is invalid/expired, kick
  # it. If false, the player is instead allowed in as a cracked player
  # (NOT recommended: it lets anyone use a premium name).
  kick-on-invalid-session: true

  # Kick message shown when a premium session cannot be verified.
  # This is intentionally identical to the vanilla message a cracked client
  # sees when connecting to an online-mode server, to avoid confusion.
  invalid-session-message: "Failed to verify username!"

floodgate:
  # Auto-login Bedrock (Floodgate) players into AuthMe on join.
  enabled: true

  # Automatically register Bedrock players that have never joined before.
  # Their AuthMe password is a random, unguessable value stored in the DB;
  # they never type it because they are force-logged-in every time.
  auto-register: true

auth:
  # Automatically register brand-new premium Java players in AuthMe using a
  # random generated password (stored in the SQLite database). On later
  # joins the same stored password is used to log them in. Players never
  # need to run /register or /login.
  auto-register: true

  # Length of the randomly generated password stored for auto-registered
  # accounts. Longer is safer; these are never typed by a human.
  generated-password-length: 32

mojang:
  # Timeout (milliseconds) for each direct call to the Mojang API.
  # The server is assumed to be behind a proxy, so QuickLogin talks to the
  # Mojang API DIRECTLY (it never sends the client IP to the hasJoined
  # endpoint) instead of relying on the proxy.
  request-timeout-ms: 5000

  # Cache premium/UUID lookups for this many seconds to reduce API calls
  # and rate limiting. Set to 0 to disable caching.
  cache-seconds: 300

  # Number of async worker threads used for Mojang lookups / session
  # verification. 2-4 is plenty for most servers.
  worker-threads: 3

database:
  # Only SQLite is supported. The file lives in the plugin folder.
  file: "quicklogin.db"

# Set to true for verbose logging (handshake steps, API results).
# Never logs passwords or shared secrets.
debug: false
