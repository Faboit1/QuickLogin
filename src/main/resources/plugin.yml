name: QuickLogin
version: '${project.version}'
main: dev.quicklogin.QuickLoginPlugin
api-version: '1.20'
author: QuickLogin
description: Floodgate + premium Java auto-login for AuthMeReloaded. Drag-and-drop.
website: https://github.com/Faboit1/QuickLogin

# AuthMe is a hard dependency (we log players in through it).
# PacketEvents is soft: needed for premium (Mojang) verification.
# Floodgate is soft: needed for Bedrock auto-login.
depend:
  - AuthMe
softdepend:
  - floodgate
  - packetevents

commands:
  quicklogin:
    description: QuickLogin admin commands (reload, status, password reset, premium check).
    usage: /quicklogin <reload|status|reset <player>|check <name>>
    aliases: [ql]
    permission: quicklogin.admin

permissions:
  quicklogin.admin:
    description: Access to QuickLogin admin commands.
    default: op
