name: QuickLogin
version: '${project.version}'
main: dev.quicklogin.QuickLoginPlugin
api-version: '1.20'
author: QuickLogin
description: Floodgate + premium Java auto-login for AuthMeReloaded. Drag-and-drop.
website: https://github.com/Faboit1/QuickLogin

# ProtocolLib is a hard dependency (needed for the premium handshake).
# AuthMe is a hard dependency (we log players in through it).
# Floodgate is soft: without it, only premium Java auto-login is active.
depend:
  - ProtocolLib
  - AuthMe
softdepend:
  - floodgate

commands:
  quicklogin:
    description: QuickLogin admin commands (reload, status, password reset).
    usage: /quicklogin <reload|status|reset <player>>
    aliases: [ql]
    permission: quicklogin.admin

permissions:
  quicklogin.admin:
    description: Access to QuickLogin admin commands.
    default: op
