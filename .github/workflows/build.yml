name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Velocity 4's API + annotation processor are compiled for Java 25, so the
      # build needs a JDK 25. Output bytecode is still targeted at 17
      # (maven.compiler.release), so both jars run on Java 17+ servers.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp package

      - name: Upload Velocity plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: QuickLogin-Velocity
          path: velocity/target/QuickLogin-Velocity-*.jar
          if-no-files-found: error

      - name: Upload Bukkit plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: QuickLogin-Bukkit
          path: bukkit/target/QuickLogin-Bukkit-*.jar
          if-no-files-found: error

      - name: Attach jars to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            velocity/target/QuickLogin-Velocity-*.jar
            bukkit/target/QuickLogin-Bukkit-*.jar
